name: Dependabot triage

# Reads open Dependabot alerts from the GitHub API, assesses each one
# (severity × reachability × fix-safety, with root-cause dedup), and refreshes a
# single "🔒 Dependabot alert triage" issue with a pre-triaged digest. It FLAGS,
# it does not merge or dismiss — same philosophy as spam-guard.yml.
#
# The alerts API isn't exposed to a checked-out clone, which is why this runs in
# Actions. NOTE: the built-in GITHUB_TOKEN CANNOT read the Dependabot alerts API
# — `security-events` only covers code/secret scanning, and the Actions app is
# not granted the separate "Dependabot alerts" permission (GitHub returns 403
# "Resource not accessible by integration"). Supply a fine-grained PAT with
# "Dependabot alerts: read" (+ Issues: read/write, Contents: read) as the
# DEPENDABOT_ALERTS_TOKEN repository secret. Without it the job no longer fails —
# the script skips with an actionable note in the run summary.

on:
  schedule:
    # Mondays 20:00 UTC ≈ 06:00 Australia/Sydney, just after the weekly
    # Dependabot PRs are cut.
    - cron: "0 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read   # read package-lock.json / source for local signals (fallback token)
  issues: write    # upsert the digest issue (fallback token)

concurrency:
  group: dependabot-triage
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Assess alerts and refresh digest
        env:
          # Prefer the PAT that can actually read Dependabot alerts; fall back to
          # GITHUB_TOKEN (which will 403 on the alerts API, handled gracefully).
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/dependabot-triage.mjs
